name: Calculateur Historique Workshop

on:
  workflow_dispatch: # Te permet de le lancer à la main depuis l'interface GitHub si besoin
  repository_dispatch:
    types: [clear_history] # Reçoit l'ordre immédiatement quand tu cliques sur un bouton du site

jobs:
  build-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # ÉTAPE CLEAR : S'exécute SEULEMENT si tu as cliqué sur le bouton "Vider cet historique"
    - name: Nettoyage de l'historique demandé
      if: github.event_name == 'repository_dispatch' && github.event.action == 'clear_history'
      run: |
        TARGET_TAB="${{ github.event.client_payload.target }}"
        node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('./history.json', 'utf8'));
          if ('$TARGET_TAB' === 'added') data.added = [];
          if ('$TARGET_TAB' === 'removed') data.removed = [];
          fs.writeFileSync('./history.json', JSON.stringify(data, null, 2));
        "

    # ÉTAPE SCAN : S'exécute si tu as cliqué sur "Forcer la synchronisation Steam" ou si tu le lances depuis GitHub
    - name: Lancer la détection des changements
      if: github.event_name != 'repository_dispatch' || github.event.action != 'clear_history'
      run: node checker.js

    - name: Enregistrer les modifications dans le dépôt
      run: |
        git config --global user.name 'GMod Bot'
        git config --global user.email 'bot@github.com'
        git add history.json
        if ! git diff --quiet --staged; then
          git commit -m "Mise à jour à la demande de l'historique [skip ci]"
          git pull --rebase origin main
          git push origin main
        else
          echo "Aucun changement détecté dans la collection."
        fi
