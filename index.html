<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection d'Addons GMod</title>
    <style>
        :root {
            --bg-color: #1b2838;
            --card-color: #2a475e;
            --text-color: #c7d5e0;
            --accent-color: #66c0f4;
            --hover-color: #101822;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #fff;
            margin-bottom: 10px;
        }

        .loader {
            text-align: center;
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-top: 50px;
        }

        #addons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .addon-card {
            background-color: var(--card-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .addon-card:hover {
            transform: translateY(-5px);
            background-color: var(--hover-color);
        }

        .addon-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background-color: #000;
        }

        .addon-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .addon-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin: 0 0 10px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .addon-link {
            font-size: 0.85rem;
            color: var(--accent-color);
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>📦 Liste des Addons du Serveur</h1>
        <p>Cette liste affiche en direct les addons de notre collection Steam Workshop.</p>
    </header>

    <div id="loader" class="loader">Connexion à Steam et récupération des addons...</div>

    <main id="addons-grid"></main>

    <script>
        const COLLECTION_ID = "2517487893"; 
        const PROXY_URL = "https://corsproxy.io/?"; 

        async function loadAddons() {
            const grid = document.getElementById('addons-grid');
            const loader = document.getElementById('loader');

            try {
                // 1. Récupérer les IDs de la collection (en utilisant x-www-form-urlencoded via le proxy)
                const collectionTarget = 'https://api.steampowered.com/ISteamRemoteStorage/GetCollectionDetails/v1/';
                const collectionResponse = await fetch(PROXY_URL + encodeURIComponent(collectionTarget), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `collectioncount=1&publishedfileids[0]=${COLLECTION_ID}`
                });
                const collectionData = await collectionResponse.json();
                
                const items = collectionData.response.collectiondetails[0].children;
                if (!items) {
                    loader.textContent = "La collection est vide ou introuvable (Vérifiez qu'elle est bien Publique).";
                    return;
                }

                const addonIds = items.map(item => item.publishedfileid);

                // 2. Construire les paramètres pour obtenir les détails de chaque addon
                let detailsBody = `itemcount=${addonIds.length}`;
                addonIds.forEach((id, index) => {
                    detailsBody += `&publishedfileids[${index}]=${id}`;
                });

                const detailsTarget = 'https://api.steampowered.com/ISteamRemoteStorage/GetPublishedFileDetails/v1/';
                const steamResponse = await fetch(PROXY_URL + encodeURIComponent(detailsTarget), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: detailsBody
                });
                const steamData = await steamResponse.json();
                const addonsDetails = steamData.response.publishedfiledetails;

                loader.style.display = 'none';

                // 3. Affichage des cartes d'addons
                addonsDetails.forEach(addon => {
                    if (addon.result === 9) return; 

                    const card = document.createElement('a');
                    card.className = 'addon-card';
                    card.href = `https://steamcommunity.com/sharedfiles/filedetails/?id=${addon.publishedfileid}`;
                    card.target = '_blank';

                    const imageUrl = addon.preview_url || 'https://via.placeholder.com/300x169?text=Pas+d+image';

                    card.innerHTML = `
                        <img class="addon-image" src="${imageUrl}" alt="${addon.title}" loading="lazy">
                        <div class="addon-info">
                            <h2 class="addon-title" title="${addon.title}">${addon.title}</h2>
                            <span class="addon-link">Voir sur le Workshop →</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                loader.textContent = "Erreur de chargement. Vérifiez que la collection Steam est bien publique.";
                loader.style.color = "#ff4a4a";
            }
        }

        document.addEventListener('DOMContentLoaded', loadAddons);
    </script>
</body>
</html>
