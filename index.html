<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection d'Addons GMod</title>
    <style>
        :root {
            --bg-color: #1b2838;
            --card-color: #2a475e;
            --text-color: #c7d5e0;
            --accent-color: #66c0f4;
            --hover-color: #101822;
            --success-color: #4caf50;
            --danger-color: #f44336;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 60px;
        }

        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #fff; margin-bottom: 10px; }

        /* Onglets */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--card-color);
            color: #fff;
            border: 2px solid transparent;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { background-color: var(--hover-color); border-color: var(--accent-color); }
        .tab-btn.active { background-color: var(--accent-color); color: var(--hover-color); }
        .tab-btn.tab-added.active { background-color: var(--success-color); color: #fff; }
        .tab-btn.tab-removed.active { background-color: var(--danger-color); color: #fff; }

        /* Zone d'action Admin (Bouton Clear) */
        .admin-zone {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            height: 40px;
        }

        .clear-btn {
            display: none; /* Caché par défaut, apparaît selon l'onglet */
            background-color: #4a154b;
            color: #fff;
            border: 1px solid var(--danger-color);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .clear-btn:hover {
            background-color: var(--danger-color);
        }

        .loader { text-align: center; font-size: 1.2rem; color: var(--accent-color); margin-top: 50px; }

        #addons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .addon-card {
            background-color: var(--card-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .addon-card:hover { transform: translateY(-5px); background-color: var(--hover-color); }

        .addon-card.card-added { border: 1px solid var(--success-color); }
        .addon-card.card-removed { border: 1px dashed var(--danger-color); opacity: 0.6; }

        .addon-image { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background-color: #000; }
        .addon-info { padding: 15px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .addon-title { font-size: 1rem; font-weight: 600; color: #fff; margin: 0 0 10px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .addon-link { font-size: 0.85rem; color: var(--accent-color); text-align: right; font-weight: bold; }
        .card-added .addon-link { color: var(--success-color); }
        .card-removed .addon-link { color: var(--danger-color); }

        #scrollTopBtn {
            display: none; position: fixed; bottom: 30px; right: 30px; z-index: 99; border: none;
            background-color: var(--accent-color); color: var(--hover-color); cursor: pointer;
            padding: 15px; border-radius: 50px; font-size: 1.2rem; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 50px; height: 50px; align-items: center; justify-content: center;
        }
        #scrollTopBtn:hover { background-color: #fff; transform: scale(1.1); }
    </style>
</head>
<body>

    <button id="scrollTopBtn" onclick="scrollToTop()">▲</button>

    <header>
        <h1>📦 Gestion des Addons du Serveur</h1>
        <p>Suivi en direct et historique complet de notre collection Steam Workshop.</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('current')">Collection Actuelle</button>
        <button class="tab-btn tab-added" onclick="switchTab('added')">🔥 Récemment Ajoutés</button>
        <button class="tab-btn tab-removed" onclick="switchTab('removed')">🗑️ Supprimés</button>
    </div>

    <div class="admin-zone">
        <button id="clearBtn" class="clear-btn" onclick="clearHistory()">🧹 Vider cet historique</button>
    </div>

    <div id="loader" class="loader">Chargement de l'historique...</div>

    <main id="addons-grid"></main>

    <script>
        const PROXY_URL = "https://corsproxy.io/?"; 
        let historyData = {}; 
        let currentTab = 'current';

        window.onscroll = function() {
            const btn = document.getElementById("scrollTopBtn");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) btn.style.display = "flex";
            else btn.style.display = "none";
        };
        function scrollToTop() { document.documentElement.scrollTop = 0; }

        async function init() {
            const loader = document.getElementById('loader');
            try {
                const response = await fetch(`./history.json?t=${Date.now()}`);
                if (!response.ok) throw new Error();
                historyData = await response.json();

                loader.style.display = 'none';
                switchTab('current'); 
            } catch (e) {
                loader.textContent = "Erreur d'initialisation. En attente du premier scan...";
                loader.style.color = "var(--danger-color)";
            }
        }

        async function switchTab(category) {
            currentTab = category;
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(b => b.classList.remove('active'));
            
            // Gestion de l'activation visuelle du bouton cliqué
            if(event && event.target) event.target.classList.add('active');

            // Afficher le bouton de nettoyage SEULEMENT sur 'added' et 'removed'
            const clearBtn = document.getElementById('clearBtn');
            if (category === 'added' || category === 'removed') {
                clearBtn.style.display = "block";
            } else {
                clearBtn.style.display = "none";
            }

            const grid = document.getElementById('addons-grid');
            grid.innerHTML = "<div class='loader'>Récupération des données Steam...</div>";

            const ids = historyData[category] || [];

            if (ids.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #8b9bb4;">Aucun addon dans cette catégorie pour le moment.</p>`;
                return;
            }

            try {
                let bodyParams = `itemcount=${ids.length}`;
                ids.forEach((id, idx) => { bodyParams += `&publishedfileids[${idx}]=${id}`; });

                const target = 'https://api.steampowered.com/ISteamRemoteStorage/GetPublishedFileDetails/v1/';
                const res = await fetch(PROXY_URL + encodeURIComponent(target), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: bodyParams
                });
                const steamData = await res.json();
                const details = steamData.response.publishedfiledetails;

                grid.innerHTML = ""; 

                details.forEach(addon => {
                    const card = document.createElement('a');
                    card.className = `addon-card card-${category}`;
                    card.href = `https://steamcommunity.com/sharedfiles/filedetails/?id=${addon.publishedfileid}`;
                    card.target = '_blank';

                    const imageUrl = addon.preview_url || 'https://via.placeholder.com/300x169?text=Image+Workshop';
                    const title = addon.title || `Addon Introuvable (${addon.publishedfileid})`;
                    
                    let statusText = "Voir sur le Workshop →";
                    if(category === 'added') statusText = "Nouveau ! Voir →";
                    if(category === 'removed') statusText = "Supprimé de la collection ✖";

                    card.innerHTML = `
                        <img class="addon-image" src="${imageUrl}" alt="${title}" loading="lazy">
                        <div class="addon-info">
                            <h2 class="addon-title" title="${title}">${title}</h2>
                            <span class="addon-link">${statusText}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--danger-color);">Erreur lors de la liaison avec Steam.</p>`;
            }
        }

        // --- FONCTION DE NETTOYAGE (CLEAR) VIA DISPATCH GITHUB ---
        function clearHistory() {
            const categoryName = currentTab === 'added' ? 'Récemment Ajoutés' : 'Supprimés';
            if (!confirm(`Voulez-vous vraiment vider l'historique des "${categoryName}" ?`)) return;

            const password = prompt("Entrez votre mot de passe Admin GitHub :");
            if (!password) return;

            const btn = document.getElementById('clearBtn');
            btn.textContent = "Nettoyage en cours sur GitHub...";
            btn.disabled = true;

            // On envoie l'ordre de clear directement au workflow GitHub Actions via l'API GitHub
            // Utilise l'API Repository Dispatch pour déclencher l'action à distance
            fetch('https://api.github.com/repos/Megaghosty/WorkshopChangelog/dispatches', {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': `Bearer ${password}`
                },
                body: JSON.stringify({
                    event_type: 'clear_history',
                    client_payload: { target: currentTab }
                })
            })
            .then(res => {
                if (res.status === 204) {
                    alert("Ordre envoyé ! GitHub est en train de vider le fichier history.json. Le site sera à jour dans 1 minute.");
                    setTimeout(() => { location.reload(); }, 2000);
                } else {
                    alert("Erreur : Le mot de passe (Token) est invalide ou expiré.");
                    btn.textContent = "🧹 Vider cet historique";
                    btn.disabled = false;
                }
            })
            .catch(err => {
                alert("Erreur réseau impossible de contacter GitHub.");
                btn.textContent = "🧹 Vider cet historique";
                btn.disabled = false;
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
